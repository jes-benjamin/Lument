<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lument Cube · 3D 演示</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0a14; color: #e8e8f0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  #wrap { display: flex; height: 100%; }
  #left { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #hint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: #9aa;
    background: rgba(0,0,0,.35); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
  /* HUD 性能面板 */
  #hud { position: absolute; right: 12px; top: 12px; min-width: 172px; font-size: 12px;
    background: rgba(8,10,20,.72); border: 1px solid #2a2a46; border-radius: 8px; padding: 10px 12px;
    font-family: ui-monospace, Menlo, Consolas, monospace; pointer-events: none; line-height: 1.65; }
  #hud .k { color: #6b7b96; }
  #hud .v { color: #7fe3a0; float: right; font-weight: 600; }
  #hud .warn { color: #ffcc66; }
  #panel { width: 300px; background: #12121f; padding: 16px; border-left: 1px solid #23233a; overflow-y: auto; }
  h2 { font-size: 15px; margin: 0 0 10px; color: #8ad; }
  h3 { font-size: 12px; margin: 14px 0 8px; color: #6a8fb8; text-transform: uppercase; letter-spacing: .06em; }
  .row { margin-bottom: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button { width: 100%; padding: 7px; background: #2a2a44; color: #e8e8f0;
    border: 1px solid #3a3a5a; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button:hover { background: #353560; }
  button.on { background: #1f4d3a; border-color: #2f7a58; color: #9fffc4; }
  input[type=text], select { width: 100%; padding: 7px; background: #1a1a2c; color: #e8e8f0;
    border: 1px solid #3a3a5a; border-radius: 6px; font-size: 12px; }
  .small { font-size: 12px; color: #99a; line-height: 1.6; }
  #log { font-family: monospace; font-size: 11px; color: #7c7; background: #0c0c16;
    padding: 8px; border-radius: 6px; height: 120px; overflow-y: auto; white-space: pre-wrap; }
  .tag { display: inline-block; background: #223; color: #7cf; padding: 1px 6px; border-radius: 4px; font-size: 11px; margin: 0 4px 4px 0; }
  label.sw { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #cdd; cursor: pointer; padding: 3px 0; }
  label.sw input { accent-color: #2f7a58; }
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <canvas id="cube-canvas" width="960" height="540"></canvas>
    <div id="hud">
      <div><span class="k">FPS</span><span class="v" id="h-fps">--</span></div>
      <div><span class="k">三角形</span><span class="v" id="h-tri">0</span></div>
      <div><span class="k">Draw Calls</span><span class="v" id="h-draw">0</span></div>
      <div><span class="k">节点 可见/剔除</span><span class="v" id="h-cull">0 / 0</span></div>
      <div><span class="k">投影</span><span class="v" id="h-proj">透视</span></div>
      <div><span class="k">模式</span><span class="v" id="h-mode">实体</span></div>
    </div>
    <div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
  </div>

  <div id="panel">
    <h2>🧊 Lument Cube · 3D</h2>
    <div class="row small">
      <span class="tag">v2.0.0</span><span class="tag">Cube</span> 原生 3D 渲染与建模文件加载。
    </div>

    <h3>程序化图元</h3>
    <div class="row grid2">
      <button data-prim="box">立方体 Box</button>
      <button data-prim="sphere">球体 Sphere</button>
      <button data-prim="plane">平面 Plane</button>
      <button data-prim="cylinder">圆柱 Cylinder</button>
      <button data-prim="cone">圆锥 Cone</button>
      <button data-prim="torus">环面 Torus</button>
    </div>

    <h3>渲染选项</h3>
    <div class="row">
      <label class="sw"><input type="checkbox" id="opt-wire" /> 线框模式 Wireframe</label>
      <label class="sw"><input type="checkbox" id="opt-grid" checked /> 网格地面 Grid</label>
      <label class="sw"><input type="checkbox" id="opt-ortho" /> 正交投影 Ortho</label>
      <label class="sw"><input type="checkbox" id="opt-spin" checked /> 自动旋转 Auto-Spin</label>
      <label class="sw"><input type="checkbox" id="opt-cull" checked /> 视锥剔除 Frustum Culling</label>
    </div>
    <div class="row">
      <select id="opt-bg">
        <option value="0.06,0.06,0.12">深空蓝（默认）</option>
        <option value="0.02,0.02,0.03">近黑</option>
        <option value="0.14,0.12,0.16">暖灰</option>
        <option value="0.05,0.12,0.16">青瓷</option>
      </select>
    </div>

    <h3>外部模型</h3>
    <div class="row">
      <input type="text" id="url" placeholder="粘贴 glTF/OBJ/STL/PLY 的 URL" />
      <div style="height:6px"></div>
      <button id="btn-load">加载模型</button>
    </div>
    <div class="row small">示例 URL：<br/>
      <code>https://modelviewer.dev/shared-assets/models/Astronaut.glb</code><br/>
      <code>https://threejs.org/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf</code>
    </div>

    <h3>支持格式</h3>
    <div class="row" id="fmts"></div>

    <h3>日志</h3>
    <div id="log"></div>
  </div>
</div>

<script src="../runtime/js/lument.js"></script>
<script>
(function(){
  const Cube = Lument.Cube;
  const cv = document.getElementById('cube-canvas');
  if (!Cube.init(cv)) { alert('当前浏览器不支持 WebGL2，无法运行 3D 演示。'); return; }

  // 相机轨道参数
  let az = 35, el = 25, radius = 5, target = [0,0,0];
  const camera = { position:[0,0,5], target:[0,0,0], up:[0,1,0], fovY:55, near:0.05, far:500,
                   projection: Cube.PROJECTION.perspective, orthoHeight: 4 };

  // 场景根节点
  const root = Cube.createNode();
  Cube.setAmbient([0.22,0.22,0.28]);
  Cube.setLight([6,9,6], [1,1,1], 1.1, 1);         // 点光
  Cube.setLight([0,1,0.3], [0.6,0.7,1.0], 0.5, 0); // 方向光（冷色补光）

  const MATERIALS = {
    box:      { baseColor:[0.35,0.62,0.95], roughness:0.45, metallic:0.15 },
    sphere:   { baseColor:[0.92,0.45,0.38], roughness:0.35, metallic:0.25 },
    plane:    { baseColor:[0.42,0.72,0.55], roughness:0.75, metallic:0.05 },
    cylinder: { baseColor:[0.95,0.75,0.32], roughness:0.40, metallic:0.30 },
    cone:     { baseColor:[0.72,0.48,0.92], roughness:0.50, metallic:0.10 },
    torus:    { baseColor:[0.38,0.85,0.86], roughness:0.28, metallic:0.45 },
  };

  function setPrimitive(kind){
    let m;
    if(kind==='sphere')        m = Cube.createSphere(1.4, 28);
    else if(kind==='plane')    m = Cube.createPlane(4,4);
    else if(kind==='cylinder') m = Cube.createCylinder(1.0, 1.0, 2.4, 28);
    else if(kind==='cone')     m = Cube.createCone(1.3, 2.4, 28);
    else if(kind==='torus')    m = Cube.createTorus(1.2, 0.42, 20, 32);
    else { kind='box'; m = Cube.createBox(2.4,2.4,2.4); }
    Cube.nodeSetModel(root, null);
    Cube.nodeSetMesh(root, m);
    root.material = MATERIALS[kind];
    root.euler = [0,0,0];
    target = [0,0,0];
    radius = (kind==='plane') ? 6 : 5;
    log('已生成程序化 '+kind+' · '+(m.indices.length/3)+' 三角形');
  }

  // 外部模型加载
  async function loadURL(url){
    log('加载中：'+url);
    try {
      const model = await Cube.loadModel(url);
      if(!model){ log('✗ 加载失败或格式不支持'); return; }
      Cube.nodeSetMesh(root, null);
      Cube.nodeSetModel(root, model);
      root.euler = [0,0,0];
      const b = model.bounds || {min:[-1,-1,-1],max:[1,1,1]};
      const cx=(b.min[0]+b.max[0])/2, cy=(b.min[1]+b.max[1])/2, cz=(b.min[2]+b.max[2])/2;
      const size=Math.max(b.max[0]-b.min[0],b.max[1]-b.min[1],b.max[2]-b.min[2])||2;
      target=[cx,cy,cz]; radius=size*1.8;
      let tri=0; for(const ms of model.meshes) tri += Math.floor(ms.indices.length/3);
      log('✓ 加载成功：'+model.meshes.length+' 个子网格 / '+tri+' 三角形');
    } catch(e){ log('✗ 异常：'+e.message); }
  }

  // 轨道相机 -> 笛卡尔坐标
  function updateCamera(){
    const er = el*Math.PI/180, ar = az*Math.PI/180;
    camera.position = [
      target[0] + radius*Math.cos(er)*Math.sin(ar),
      target[1] + radius*Math.sin(er),
      target[2] + radius*Math.cos(er)*Math.cos(ar)
    ];
    camera.target = target;
    // 正交投影下缩放依然有效：正交高度跟随观察半径
    camera.orthoHeight = Math.max(0.5, radius*0.85);
  }

  // 自适应分辨率
  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const w = Math.max(1, Math.floor(cv.clientWidth*dpr)), h = Math.max(1, Math.floor(cv.clientHeight*dpr));
    if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  }
  window.addEventListener('resize', resize);

  // HUD 更新
  const elFps=document.getElementById('h-fps'), elTri=document.getElementById('h-tri');
  const elDraw=document.getElementById('h-draw'), elCull=document.getElementById('h-cull');
  const elProj=document.getElementById('h-proj'), elMode=document.getElementById('h-mode');
  function updateHUD(fps){
    const s = Cube.getCullStats();
    elFps.textContent = fps;
    elFps.className = 'v' + (fps>0 && fps<30 ? ' warn' : '');
    elTri.textContent  = s.triangles.toLocaleString();
    elDraw.textContent = s.drawCalls;
    elCull.textContent = s.visible+' / '+s.culled;
    elProj.textContent = (camera.projection===Cube.PROJECTION.ortho)?'正交':'透视';
    elMode.textContent = Cube.getWireframe()?'线框':'实体';
  }

  // 动画循环
  let frames=0, lastT=performance.now(), prev=lastT;
  function frame(now){
    resize();
    const dt=Math.min((now-prev)/1000, 0.1); prev=now;
    updateCamera();
    if(document.getElementById('opt-spin').checked) root.euler[1] = (root.euler[1]||0) + dt*30;
    Cube.render(camera, root);
    frames++;
    if(now-lastT>=500){ updateHUD(Math.round(frames*1000/(now-lastT))); frames=0; lastT=now; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 鼠标轨道控制
  let dragging=false, lastX=0, lastY=0, panning=false;
  cv.addEventListener('mousedown', e=>{ if(e.button===2){panning=true;} else {dragging=true;} lastX=e.clientX; lastY=e.clientY; });
  window.addEventListener('mouseup', ()=>{ dragging=false; panning=false; });
  window.addEventListener('mousemove', e=>{
    if(!dragging&&!panning) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    if(panning){ target[0]-=dx*0.01; target[1]+=dy*0.01; }
    else { az+=dx*0.5; el=Math.max(-89,Math.min(89, el+dy*0.5)); }
  });
  cv.addEventListener('wheel', e=>{ radius=Math.max(0.5, radius*(e.deltaY>0?1.1:0.9)); e.preventDefault(); }, {passive:false});
  cv.addEventListener('contextmenu', e=>e.preventDefault());

  // 图元按钮
  document.querySelectorAll('[data-prim]').forEach(b=>{ b.onclick = ()=>setPrimitive(b.dataset.prim); });

  // 渲染选项
  document.getElementById('opt-wire').onchange  = e=>{ Cube.setWireframe(e.target.checked); log('线框模式：'+(e.target.checked?'开':'关')); };
  document.getElementById('opt-grid').onchange  = e=>{ Cube.setGrid(e.target.checked); };
  document.getElementById('opt-cull').onchange  = e=>{ Cube.setCulling(e.target.checked); log('视锥剔除：'+(e.target.checked?'开':'关')); };
  document.getElementById('opt-ortho').onchange = e=>{
    camera.projection = e.target.checked ? Cube.PROJECTION.ortho : Cube.PROJECTION.perspective;
    log('投影切换为：'+(e.target.checked?'正交':'透视'));
  };
  document.getElementById('opt-bg').onchange = e=>{
    const p = e.target.value.split(',').map(Number);
    Cube.setBackground([p[0],p[1],p[2],1]);
  };

  document.getElementById('btn-load').onclick = ()=>{ const u=document.getElementById('url').value.trim(); if(u) loadURL(u); };

  // 列出支持格式
  document.getElementById('fmts').innerHTML = Cube.supportedFormats.map(f=>'<span class="tag">'+(f.fmt||f.name)+'</span>').join(' ');

  function log(s){ const el=document.getElementById('log'); el.textContent += s+'\n'; el.scrollTop=el.scrollHeight; }

  resize();
  setPrimitive('box');
  log('Lument '+Lument.VERSION+' ['+Lument.EDITION+'] · Cube 初始化完成');
})();
</script>
</body>
</html>
