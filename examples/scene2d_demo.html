<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lument 2D 场景渲染 Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a14;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { color: #66ccff; margin-bottom: 10px; font-size: 22px; }
        .subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }
        .main-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .canvas-container {
            position: relative;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        #game-canvas { display: block; background: #000; }
        .controls {
            width: 340px;
            background: #14141e;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #2a2a3a;
            max-height: 540px;
            overflow-y: auto;
        }
        .control-section { margin-bottom: 16px; }
        .control-section h3 {
            color: #66ccff;
            font-size: 13px;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #2a2a3a;
        }
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .control-row label { color: #aaa; min-width: 70px; }
        .control-row input[type="range"] {
            flex: 1;
            margin: 0 8px;
            height: 4px;
            -webkit-appearance: none;
            background: #2a2a3a;
            border-radius: 2px;
        }
        .control-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #66ccff;
            cursor: pointer;
        }
        .control-row .value {
            min-width: 40px;
            text-align: right;
            color: #66ccff;
            font-family: monospace;
            font-size: 11px;
        }
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn {
            background: #1e1e2e;
            color: #ccc;
            border: 1px solid #333;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .btn:hover { background: #2a2a4a; border-color: #555; }
        .btn.active { background: #2a4a6a; border-color: #66ccff; color: #fff; }
        .color-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
        .color-row input[type="color"] { width: 30px; height: 24px; border: none; border-radius: 4px; cursor: pointer; background: none; }
        .preset-btns { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
        .preset-btn { padding: 3px 8px; font-size: 10px; }
        .stats { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 10px; color: #6f6; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Lument Engine 2D 场景渲染 Demo</h1>
    <p class="subtitle">色彩色调 / 清晰度 / 光线渲染 / 图片接入 — 拖动滑块实时预览效果</p>
    <div class="main-container">
        <div class="canvas-container">
            <canvas id="game-canvas" width="480" height="540"></canvas>
            <div class="stats" id="stats">FPS: 0 | DC: 0</div>
        </div>
        <div class="controls">
            <!-- 色彩色调 -->
            <div class="control-section">
                <h3>色彩色调控制</h3>
                <div class="control-row">
                    <label>亮度</label>
                    <input type="range" id="brightness" min="0" max="2" step="0.05" value="1">
                    <span class="value" id="brightness-val">1.00</span>
                </div>
                <div class="control-row">
                    <label>对比度</label>
                    <input type="range" id="contrast" min="0" max="2" step="0.05" value="1">
                    <span class="value" id="contrast-val">1.00</span>
                </div>
                <div class="control-row">
                    <label>饱和度</label>
                    <input type="range" id="saturation" min="0" max="2" step="0.05" value="1">
                    <span class="value" id="saturation-val">1.00</span>
                </div>
                <div class="control-row">
                    <label>色相偏移</label>
                    <input type="range" id="hueShift" min="0" max="360" step="5" value="0">
                    <span class="value" id="hueShift-val">0</span>
                </div>
                <div class="control-row">
                    <label>灰度</label>
                    <input type="range" id="grayscale" min="0" max="1" step="0.05" value="0">
                    <span class="value" id="grayscale-val">0.00</span>
                </div>
                <div class="control-row">
                    <label>棕褐色</label>
                    <input type="range" id="sepia" min="0" max="1" step="0.05" value="0">
                    <span class="value" id="sepia-val">0.00</span>
                </div>
                <div class="control-row">
                    <label>反色</label>
                    <input type="range" id="invert" min="0" max="1" step="0.05" value="0">
                    <span class="value" id="invert-val">0.00</span>
                </div>
                <div class="color-row">
                    <label style="font-size:12px;color:#aaa;min-width:70px;">色调叠加</label>
                    <input type="color" id="tint-color" value="#ffffff">
                    <input type="range" id="tint-alpha" min="0" max="255" step="5" value="255" style="flex:1;">
                    <span class="value" id="tint-alpha-val">255</span>
                </div>
                <div class="preset-btns">
                    <button class="btn preset-btn" data-preset="reset">重置</button>
                    <button class="btn preset-btn" data-preset="sunset">日落</button>
                    <button class="btn preset-btn" data-preset="night">夜晚</button>
                    <button class="btn preset-btn" data-preset="dream">梦境</button>
                    <button class="btn preset-btn" data-preset="horror">恐怖</button>
                </div>
            </div>

            <!-- 清晰度 -->
            <div class="control-section">
                <h3>清晰度控制</h3>
                <div class="control-row">
                    <label>锐化</label>
                    <input type="range" id="sharpness" min="-1" max="1" step="0.1" value="0">
                    <span class="value" id="sharpness-val">0.00</span>
                </div>
                <div class="control-row">
                    <label>模糊半径</label>
                    <input type="range" id="blur" min="0" max="10" step="0.5" value="0">
                    <span class="value" id="blur-val">0.0</span>
                </div>
            </div>

            <!-- 暗角与雾效 -->
            <div class="control-section">
                <h3>暗角与雾效</h3>
                <div class="control-row">
                    <label>暗角强度</label>
                    <input type="range" id="vignette-i" min="0" max="1" step="0.05" value="0">
                    <span class="value" id="vignette-i-val">0.00</span>
                </div>
                <div class="control-row">
                    <label>暗角半径</label>
                    <input type="range" id="vignette-r" min="0.3" max="1" step="0.05" value="0.7">
                    <span class="value" id="vignette-r-val">0.70</span>
                </div>
                <div class="control-row">
                    <label>雾密度</label>
                    <input type="range" id="fog-d" min="0" max="1" step="0.05" value="0">
                    <span class="value" id="fog-d-val">0.00</span>
                </div>
                <div class="color-row">
                    <label style="font-size:12px;color:#aaa;min-width:70px;">雾颜色</label>
                    <input type="color" id="fog-color" value="#808080">
                </div>
            </div>

            <!-- 光线 -->
            <div class="control-section">
                <h3>光线渲染</h3>
                <div class="color-row">
                    <label style="font-size:12px;color:#aaa;min-width:70px;">环境光色</label>
                    <input type="color" id="ambient-color" value="#ffffff">
                    <input type="range" id="ambient-i" min="0" max="1" step="0.05" value="0">
                    <span class="value" id="ambient-i-val">0.00</span>
                </div>
                <div class="btn-group" style="margin-top:8px;">
                    <button class="btn" id="add-point-light">添加点光源</button>
                    <button class="btn" id="add-dir-light">添加方向光</button>
                    <button class="btn" id="clear-lights">清除光源</button>
                </div>
                <div style="margin-top:4px;font-size:11px;color:#888;" id="light-info">光源数: 0</div>
            </div>

            <!-- 图片接入 -->
            <div class="control-section">
                <h3>图片接入</h3>
                <div class="btn-group">
                    <button class="btn" id="gen-image">生成测试图片</button>
                    <button class="btn" id="toggle-tiled">切换平铺</button>
                    <button class="btn" id="toggle-rotated">切换旋转</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../runtime/js/lument.js"></script>
    <script>
        // ========== 初始化引擎 ==========
        Lument.init({
            platform: Lument.PLATFORM.WEB,
            rendererType: Lument.RENDERER.CANVAS2D,
            width: 480,
            height: 540,
            targetFPS: 60,
        });

        // ========== 场景状态 ==========
        let testTextureId = 0;
        let tiledMode = false;
        let rotatedMode = false;
        let lightIds = [];
        let animTime = 0;

        // 生成测试图片纹理
        function generateTestImage() {
            const w = 64, h = 64;
            const data = new Uint8Array(w * h * 4);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const r = Math.sin(x * 0.1) * 127 + 128;
                    const g = Math.cos(y * 0.1) * 127 + 128;
                    const b = Math.sin((x + y) * 0.05) * 127 + 128;
                    data[i] = r; data[i+1] = g; data[i+2] = b; data[i+3] = 255;
                }
            }
            return Lument.createTextureFromData(w, h, data);
        }

        testTextureId = generateTestImage();

        // ========== 主渲染循环 ==========
        function render() {
            Lument.beginFrame();
            animTime += Lument.getDeltaTime() * 0.001;

            // 绘制场景背景
            Lument.clear({ r: 15, g: 15, b: 30, a: 255 });

            // 绘制渐变天空
            for (let y = 0; y < 200; y++) {
                const t = y / 200;
                const r = Math.round(20 + t * 30);
                const g = Math.round(20 + t * 40);
                const b = Math.round(50 + t * 60);
                Lument.drawRect({ x: 0, y: y, w: 480, h: 1 }, { r, g, b, a: 255 }, true);
            }

            // 绘制地面
            Lument.drawRect({ x: 0, y: 400, w: 480, h: 140 }, { r: 35, g: 30, b: 25, a: 255 }, true);

            // 绘制测试图片
            if (testTextureId) {
                if (tiledMode) {
                    Lument.drawImageTiled(testTextureId,
                        { x: 50, y: 220, w: 380, h: 160 },
                        { x: 0, y: 0, w: 64, h: 64 },
                        animTime * 20, 0);
                } else if (rotatedMode) {
                    Lument.drawImageRotated(testTextureId,
                        240, 300, animTime * 30, 2.0,
                        { x: 0, y: 0, w: 64, h: 64 });
                } else {
                    Lument.drawImageWithColor(testTextureId,
                        { x: 100, y: 220, w: 280, h: 160 },
                        { x: 0, y: 0, w: 64, h: 64 },
                        { r: 255, g: 255, b: 255, a: 255 });
                }
            }

            // 绘制装饰矩形
            for (let i = 0; i < 5; i++) {
                const x = 40 + i * 90 + Math.sin(animTime + i) * 10;
                const y = 80 + Math.cos(animTime * 0.5 + i) * 20;
                const colors = [
                    { r: 255, g: 100, b: 100, a: 200 },
                    { r: 100, g: 255, b: 100, a: 200 },
                    { r: 100, g: 100, b: 255, a: 200 },
                    { r: 255, g: 255, b: 100, a: 200 },
                    { r: 255, g: 100, b: 255, a: 200 },
                ];
                Lument.drawRect({ x: x, y: y, w: 40, h: 40 }, colors[i], true);
            }

            // 渲染光线
            Lument.renderLights();

            // 应用场景后期效果
            Lument.applySceneEffects();

            Lument.endFrame();

            // 更新统计
            const stats = Lument.getStats();
            document.getElementById('stats').textContent = `FPS: ${stats.fps} | DC: ${stats.drawCalls}`;

            requestAnimationFrame(render);
        }

        // ========== 控件绑定 ==========
        function bindSlider(id, callback) {
            const el = document.getElementById(id);
            const valEl = document.getElementById(id + '-val');
            el.addEventListener('input', function() {
                const v = parseFloat(this.value);
                if (valEl) valEl.textContent = v.toFixed(2);
                callback(v);
            });
        }

        bindSlider('brightness', v => Lument.setSceneBrightness(v));
        bindSlider('contrast', v => Lument.setSceneContrast(v));
        bindSlider('saturation', v => Lument.setSceneSaturation(v));
        bindSlider('hueShift', v => { Lument.setSceneHueShift(v); document.getElementById('hueShift-val').textContent = v; });
        bindSlider('grayscale', v => Lument.setSceneGrayscale(v));
        bindSlider('sepia', v => Lument.setSceneSepia(v));
        bindSlider('invert', v => Lument.setSceneInvert(v));
        bindSlider('sharpness', v => Lument.setSceneSharpness(v));
        bindSlider('blur', v => { Lument.setSceneBlur(v); document.getElementById('blur-val').textContent = v.toFixed(1); });
        bindSlider('vignette-i', v => {
            const r = parseFloat(document.getElementById('vignette-r').value);
            Lument.setVignette(v, r);
        });
        bindSlider('vignette-r', v => {
            const i = parseFloat(document.getElementById('vignette-i').value);
            Lument.setVignette(i, v);
        });
        bindSlider('fog-d', v => {
            const c = hexToRgb(document.getElementById('fog-color').value);
            Lument.setFog(c, v, 0, 500);
        });
        bindSlider('ambient-i', v => {
            const c = hexToRgb(document.getElementById('ambient-color').value);
            Lument.setAmbientLight(c, v);
        });
        bindSlider('tint-alpha', v => {
            const c = hexToRgb(document.getElementById('tint-color').value);
            Lument.setSceneTint({ r: c.r, g: c.g, b: c.b, a: Math.round(v) });
        });

        document.getElementById('tint-color').addEventListener('input', function() {
            const c = hexToRgb(this.value);
            const a = parseInt(document.getElementById('tint-alpha').value);
            Lument.setSceneTint({ r: c.r, g: c.g, b: c.b, a: a });
        });
        document.getElementById('fog-color').addEventListener('input', function() {
            const c = hexToRgb(this.value);
            const d = parseFloat(document.getElementById('fog-d').value);
            Lument.setFog(c, d, 0, 500);
        });
        document.getElementById('ambient-color').addEventListener('input', function() {
            const c = hexToRgb(this.value);
            const i = parseFloat(document.getElementById('ambient-i').value);
            Lument.setAmbientLight(c, i);
        });

        // 预设
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const preset = this.dataset.preset;
                applyPreset(preset);
            });
        });

        function applyPreset(name) {
            Lument.resetSceneColor();
            Lument.resetVignette();
            Lument.resetFog();

            switch(name) {
                case 'reset':
                    setSliderVals({ brightness: 1, contrast: 1, saturation: 1, hueShift: 0,
                                    grayscale: 0, sepia: 0, invert: 0, 'vignette-i': 0, 'fog-d': 0 });
                    setTint('#ffffff', 255);
                    break;
                case 'sunset':
                    Lument.setSceneBrightness(1.1);
                    Lument.setSceneContrast(1.2);
                    Lument.setSceneSaturation(1.3);
                    Lument.setSceneTint({ r: 255, g: 140, b: 60, a: 180 });
                    Lument.setVignette(0.4, 0.7);
                    setSliderVals({ brightness: 1.1, contrast: 1.2, saturation: 1.3, hueShift: 0,
                                    grayscale: 0, sepia: 0, invert: 0, 'vignette-i': 0.4, 'fog-d': 0 });
                    setTint('#ff8c3c', 180);
                    break;
                case 'night':
                    Lument.setSceneBrightness(0.5);
                    Lument.setSceneContrast(1.3);
                    Lument.setSceneSaturation(0.7);
                    Lument.setSceneTint({ r: 40, g: 60, b: 120, a: 200 });
                    Lument.setVignette(0.6, 0.6);
                    Lument.setAmbientLight({ r: 50, g: 50, b: 100, a: 255 }, 0.3);
                    setSliderVals({ brightness: 0.5, contrast: 1.3, saturation: 0.7, hueShift: 0,
                                    grayscale: 0, sepia: 0, invert: 0, 'vignette-i': 0.6, 'fog-d': 0, 'ambient-i': 0.3 });
                    setTint('#28387c', 200);
                    break;
                case 'dream':
                    Lument.setSceneBrightness(1.2);
                    Lument.setSceneSaturation(1.5);
                    Lument.setSceneHueShift(30);
                    Lument.setSceneBlur(2);
                    Lument.setSceneTint({ r: 200, g: 180, b: 255, a: 100 });
                    setSliderVals({ brightness: 1.2, contrast: 1, saturation: 1.5, hueShift: 30,
                                    grayscale: 0, sepia: 0, invert: 0, blur: 2, 'vignette-i': 0, 'fog-d': 0 });
                    setTint('#c8b4ff', 100);
                    break;
                case 'horror':
                    Lument.setSceneBrightness(0.6);
                    Lument.setSceneContrast(1.5);
                    Lument.setSceneSaturation(0.3);
                    Lument.setSceneTint({ r: 80, g: 20, b: 20, a: 220 });
                    Lument.setVignette(0.8, 0.4);
                    Lument.setFog({ r: 20, g: 0, b: 0, a: 255 }, 0.4, 0, 500);
                    setSliderVals({ brightness: 0.6, contrast: 1.5, saturation: 0.3, hueShift: 0,
                                    grayscale: 0.3, sepia: 0, invert: 0, 'vignette-i': 0.8, 'vignette-r': 0.4, 'fog-d': 0.4 });
                    setTint('#501414', 220);
                    break;
            }
        }

        function setSliderVals(vals) {
            for (const [k, v] of Object.entries(vals)) {
                const el = document.getElementById(k);
                if (el) { el.value = v; }
                const valEl = document.getElementById(k + '-val');
                if (valEl) valEl.textContent = typeof v === 'number' ? v.toFixed(2) : v;
            }
        }

        function setTint(hex, alpha) {
            document.getElementById('tint-color').value = hex;
            document.getElementById('tint-alpha').value = alpha;
            document.getElementById('tint-alpha-val').textContent = alpha;
            const c = hexToRgb(hex);
            Lument.setSceneTint({ r: c.r, g: c.g, b: c.b, a: alpha });
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b, a: 255 };
        }

        // 光源按钮
        document.getElementById('add-point-light').addEventListener('click', function() {
            const colors = [
                { r: 255, g: 200, b: 100, a: 255 },
                { r: 100, g: 200, b: 255, a: 255 },
                { r: 255, g: 100, b: 200, a: 255 },
                { r: 150, g: 255, b: 150, a: 255 },
            ];
            const c = colors[lightIds.length % colors.length];
            const x = 80 + Math.random() * 320;
            const y = 100 + Math.random() * 300;
            const id = Lument.addLight(Lument.LIGHT.POINT, x, y, 150, c, 0.8);
            lightIds.push(id);
            updateLightInfo();
        });

        document.getElementById('add-dir-light').addEventListener('click', function() {
            const id = Lument.addLight(Lument.LIGHT.DIRECTIONAL, 0, 0, 0,
                { r: 255, g: 240, b: 200, a: 255 }, 0.5);
            lightIds.push(id);
            updateLightInfo();
        });

        document.getElementById('clear-lights').addEventListener('click', function() {
            Lument.clearLights();
            lightIds = [];
            updateLightInfo();
        });

        function updateLightInfo() {
            document.getElementById('light-info').textContent = `光源数: ${Lument.getLightCount()}`;
        }

        // 图片按钮
        document.getElementById('gen-image').addEventListener('click', function() {
            testTextureId = generateTestImage();
        });
        document.getElementById('toggle-tiled').addEventListener('click', function() {
            tiledMode = !tiledMode;
            if (tiledMode) rotatedMode = false;
            this.classList.toggle('active', tiledMode);
            document.getElementById('toggle-rotated').classList.remove('active');
        });
        document.getElementById('toggle-rotated').addEventListener('click', function() {
            rotatedMode = !rotatedMode;
            if (rotatedMode) tiledMode = false;
            this.classList.toggle('active', rotatedMode);
            document.getElementById('toggle-tiled').classList.remove('active');
        });

        // 启动渲染循环
        render();
    </script>
</body>
</html>
